<title>Assinatura de e-mail | Firebee</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f6f6f6; color: #171717; font: 15px/1.5 Arial, sans-serif; }
main { max-width: 990px; margin: 52px auto; padding: 0 20px; }
header img { display: block; width: 72px; }
h1 { margin: 12px 0 24px; font-size: clamp(28px, 5vw, 42px); line-height: 1.1; }
h2 { margin: 0 0 16px; font-size: 17px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 20px; align-items: start; }
section { min-width: 0; padding: 22px; background: white; border: 1px solid #ddd; }
.preview-panel { border-top: 3px solid #f5000f; }
label { display: block; margin-bottom: 10px; font-size: 13px; }
input { display: block; width: 100%; margin-top: 3px; padding: 7px 9px; border: 1px solid #aaa; border-radius: 3px; font: inherit; }
button { background: #171717; color: white; border: 0; border-radius: 3px; padding: 10px 15px; font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid #f5000f; outline-offset: 2px; }
details { margin: 14px 0; font-size: 13px; }
summary { cursor: pointer; }
details p, .note { color: #505050; font-size: 13px; }
#status { margin: 8px 0 0; font-size: 13px; }
#status:empty { display: none; }
#preview { overflow: auto; }
@media (max-width: 720px) { main { margin: 25px auto; padding: 0 12px; } .layout { grid-template-columns: 1fr; } section { padding: 16px; } }
</style>
</head>

  <div class="layout">
    <section aria-labelledby="dados">
      <h2 id="dados">Dados da assinatura</h2>
      <label>Nome <input id="name" autocomplete="name" placeholder="Nome Sobrenome"></label>
      <label>Cargo ou área <input id="role" autocomplete="organization-title" placeholder="Cargo ou área"></label>
      <label>Telefone <input id="phone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000"></label>

        <summary>Imagens hospedadas (opcional)</summary>
        <p>Use URLs públicas diretas dos PNGs se o editor de e-mail remover as imagens incorporadas.</p>
        <label>URL do logotipo <input id="logo" type="url" placeholder="https://"></label>
        <div id="badge-options"></div>
      </details>
      <button id="copy" type="button">Copiar assinatura</button>
      <p id="status" role="status"></p>
    </section>
    <section class="preview-panel" aria-labelledby="previa">
      <h2 id="previa">Prévia</h2>

      <p class="note">Preencha seus dados, copie a assinatura e cole nas configurações do seu e-mail.</p>
      <details id="downloads"><summary>Baixar imagens em PNG</summary></details>
    </section>
  </div>

const socialVersion = badges.some(badge => badge.href);
const fields = Object.fromEntries([...document.querySelectorAll('input')].map(input => [input.id, input]));
const badgeOptions = document.getElementById('badge-options');
const downloads = document.getElementById('downloads');
const preview = document.getElementById('preview');
const status = document.getElementById('status');

for (const [index, badge] of badges.entries()) {
  const label = document.createElement('label');
  const input = document.createElement('input');
  input.id = 'badge' + index;
  input.type = 'url';
  input.placeholder = 'https://';
  label.append('URL · ' + badge.label, input);
  badgeOptions.append(label);
  fields[input.id] = input;
}
for (const [index, asset] of [logo, ...badges].entries()) {
  const row = document.createElement('div');
  const link = document.createElement('a');
  link.href = asset.src;
  link.download = asset.href ? 'firebee-' + asset.label.toLowerCase() + '.png' : index ? 'firebee-selo-' + index + '.png' : 'firebee-logotipo.png';
  link.textContent = asset.label;
  row.append(link);
  downloads.append(row);
}

const value = id => fields[id].value.trim();
function escapeHtml(text) {
  const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return text.replace(/[&<>"']/g, character => entities[character]);
}
function webUrl(text, allowBareDomain = false) {
  if (!text) return '';
  const candidate = allowBareDomain && !text.includes('://') ? 'https://' + text : text;
  try {
    const url = new URL(candidate);
    return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
  } catch {
    return '';
  }
}
function image(asset, field, flexible = false) {
  const src = webUrl(value(field)) || asset.src;
  const size = flexible ? `width:100%;max-width:${asset.width}px;height:auto` : `width:${asset.width}px;height:${asset.height}px`;
  return `<img src="${escapeHtml(src)}" width="${asset.width}" height="${asset.height}" alt="${escapeHtml(asset.label)}" style="display:block;${size};border:0;color:#ffffff">`;
}
function contact(text, href) {
  const label = escapeHtml(text);
  return href ? `<a href="${escapeHtml(href)}" style="color:#262626;text-decoration:underline">${label}</a>` : label;
}
function signature(showPreview) {
  const name = value('name') || 'Nome Sobrenome';
  const role = value('role') || (showPreview ? 'Cargo ou área' : '');
  const phone = value('phone');
  const phoneTarget = phone.replace(/[^+\d]/g, '');
  const site = value('site');
  const address = value('address');
  const addressHtml = escapeHtml(address).replace(
    /([^,]+?)\s+([-–—])\s+([A-Z]{2})$/,
    (_, city, dash, state) => ' <span style="white-space:nowrap">' + city.trim() + '&nbsp;' + dash + '&nbsp;' + state + '</span>'
  );
  const contacts = [
    phone && contact(phone, /\d/.test(phoneTarget) ? 'tel:' + phoneTarget : ''),
    site && contact(site.replace(/^https?:\/\//i, '').replace(/\/$/, ''), webUrl(site, true))
  ].filter(Boolean);
  const assetRows = social => badges.map((badge, index) => {
    if (Boolean(badge.href) !== social) return '';
    const icon = image(badge, 'badge' + index);
    const content = badge.href ? `<a href="${escapeHtml(badge.href)}" style="display:block;text-decoration:none">${icon}</a>` : icon;
    return `<tr><td align="center" style="padding:${index ? (social ? '12px 0 0' : '4px 0 0') : '0'};font-size:0;line-height:0">${content}</td></tr>`;
  }).join('');
  return `<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="530" bgcolor="#ffffff" style="width:100%;max-width:530px;background-color:#ffffff;border-collapse:collapse;font-family:Arial,sans-serif;color:#171717">
  <tr>
    <td width="100" align="center" valign="middle"${socialVersion ? ' bgcolor="#f5000f" style="width:21%;padding:4px 7px;background-color:#f5000f"' : ' style="width:100px;padding:4px 13px 4px 0"'}>${image(logo, 'logo', socialVersion)}</td>
    <td valign="middle" style="border-left:2px solid #f5000f;padding:2px 10px 2px 13px;overflow-wrap:anywhere;word-break:break-word">
      <div style="font-size:17px;line-height:21px;font-weight:bold">${escapeHtml(name)}</div>
      ${role ? `<div style="font-size:13px;line-height:18px;color:#404040">${escapeHtml(role)}</div>` : ''}
      ${contacts.length ? `<div style="font-size:12px;line-height:17px;margin-top:5px">${contacts.join('<br>')}</div>` : ''}
      ${address ? `<div data-address style="font-size:11px;line-height:16px;margin-top:4px;color:#404040;word-break:normal">${addressHtml}</div>` : ''}
    </td>
    <td data-certifications width="${socialVersion ? 76 : 86}" align="center" valign="middle" style="width:${socialVersion ? 76 : 86}px;padding:2px 4px">
      <div style="font-size:11px;line-height:16px;font-weight:bold;padding:0 0 5px">Certificações</div>
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">${assetRows(false)}</table>
    </td>
    ${socialVersion ? `<td data-social width="36" height="140" align="center" valign="middle" bgcolor="#f5000f" style="width:36px;min-width:36px;height:140px;padding:0;background-color:#f5000f">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">${assetRows(true)}</table>
    </td>` : ''}
  </tr>
</table>`;
}
function update() {
  preview.innerHTML = signature(true);
  status.textContent = '';
}
Object.values(fields).forEach(field => field.addEventListener('input', update));
document.getElementById('copy').addEventListener('click', () => {
  if (!value('name')) {
    status.textContent = 'Preencha o nome para copiar.';
    fields.name.focus();
    return;
  }
  const markup = signature(false);
  const plain = ['name', 'role', 'phone', 'site', 'address'].map(value).filter(Boolean).join('\n');
  const copy = event => {
    if (!event.clipboardData) return;
    event.clipboardData.setData('text/html', markup);
    event.clipboardData.setData('text/plain', plain);
    event.preventDefault();
  };
  document.addEventListener('copy', copy);
  let copied = false;
  try { copied = document.execCommand('copy'); } catch {}
  finally { document.removeEventListener('copy', copy); }
  status.textContent = copied ? 'Assinatura copiada.' : 'Selecione a prévia e copie manualmente.';
});
update();
</script>
